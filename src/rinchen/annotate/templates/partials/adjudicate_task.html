<div>
  <h2>Adjudicate</h2>
  {% if is_vertical %}
  <button type="button" onclick="this.nextElementSibling.style.writingMode = this.nextElementSibling.style.writingMode === 'vertical-lr' ? 'horizontal-tb' : 'vertical-lr'">Toggle direction</button>
  <div class="src-text" style="writing-mode: vertical-lr;">{{ src }}</div>
  {% else %}
  <div class="src-text">{{ src }}</div>
  {% endif %}
  <p>Translation candidates:</p>
  <ul>
    {% for choice in choices %}
    <li>
      {% if is_vertical %}
      <button type="button" onclick="this.nextElementSibling.style.writingMode = this.nextElementSibling.style.writingMode === 'vertical-lr' ? 'horizontal-tb' : 'vertical-lr'">Toggle direction</button>
      <span class="choice-text" style="writing-mode: vertical-lr;">{{ choice['text'] }}</span>
      {% else %}
      {{ choice['text'] }}
      {% endif %}
    </li>
    {% endfor %}
  </ul>
  <form hx-post="/task/{{ task_id }}/adjudicate" hx-target="#main" hx-swap="innerHTML">
    <textarea name="text" required></textarea>
    <input type="number" name="minutes" step="0.1" required>
    <button type="submit">Submit final translation</button>
  </form>
</div>
