# Base Eole config of the tiny teacher (D8): the CPU gate of the teacher training. It is
# the model of multilingual_tiny.yaml (a 64-wide transformer with 2+2 layers, trained
# from random init) with the schedule of the gate: 200 steps, a report every 10 steps,
# a validation and a save every 50 steps, and every one of the four checkpoints kept.
# The spike measured the training loss falling by 60.4 to 62.4 percent over those 200
# steps on the toy corpora. The gate test (tests/integration/test_train_tiny_teacher.py)
# requires a fall of at least 30 percent (`curves.loss_gate`); `rinchen train launch`
# itself checks only that no loss in the log is NaN or infinite. A gate that the
# launcher, the resume and the averaging work, not a quality measure: those sentences
# are templated.
#
# This file holds no per-run value. `rinchen train ablate --prepare-only` merges these
# in, and the merged config is validated before Eole sees it:
#   src_vocab, training.model_path         the run directory
#   transforms_configs.sentencepiece       the SentencePiece model, both sides
#   data                                   the corpora, their weights and tag prefixes
#   seed                                   the variant's seed (1234 here is the default)
#
# Resuming the run is not configured here: the launcher renders a separate resume file
# for that, and the model stays one trained from random init.
seed: 1234
share_vocab: true
overwrite: true
# One report every 10 steps: the loss gate reads the first and the last of them.
report_every: 10
data: {}
transforms_configs:
  filtertoolong:
    src_seq_length: 64
    tgt_seq_length: 64
model:
  architecture: transformer
  hidden_size: 64
  encoder:
    layers: 2
  decoder:
    layers: 2
  heads: 4
  transformer_ff: 128
  embeddings:
    # Equal to hidden_size: Eole's default of 512 breaks a smaller model.
    word_vec_size: 64
    position_encoding_type: SinusoidalInterleaved
  share_embeddings: true
  share_decoder_embeddings: true
training:
  batch_type: tokens
  batch_size: 2048
  accum_count: [1]
  # Dropout 0: the toy corpora are small and the run is 200 steps.
  dropout: [0.0]
  attention_dropout: [0.0]
  optim: adamw
  decay_method: noam
  label_smoothing: 0.1
  world_size: 1
  train_steps: 200
  # A validation at every save, and all four saves kept: Eole keeps the last
  # keep_checkpoint checkpoints, so the averaging has four to take.
  valid_steps: 50
  save_checkpoint_steps: 50
  keep_checkpoint: 4
  learning_rate: 0.5
  warmup_steps: 100
  compute_dtype: fp32
  gpu_ranks: []
  # Eole's defaults (262144 and 200) made 100 steps take twice as long on the CPU.
  bucket_size: 1024
  prefetch_factor: 8
  num_workers: 1
