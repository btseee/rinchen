seed: 1234
save_data: data/script_conv/run/data
src_vocab: data/script_conv/run/vocab.src
tgt_vocab: data/script_conv/run/vocab.tgt
share_vocab: true
src_vocab_size: 512
tgt_vocab_size: 512
overwrite: true
data:
  cyrl2mong:
    path_src: data/script_conv/corpus/cyrl2mong.train.src
    path_tgt: data/script_conv/corpus/cyrl2mong.train.tgt
    transforms:
    - sentencepiece
    - prefix
    - filtertoolong
    src_prefix: <2mn_Mong>
    tgt_prefix: ''
    weight: 1
  mong2cyrl:
    path_src: data/script_conv/corpus/mong2cyrl.train.src
    path_tgt: data/script_conv/corpus/mong2cyrl.train.tgt
    transforms:
    - sentencepiece
    - prefix
    - filtertoolong
    src_prefix: <2mn_Cyrl>
    tgt_prefix: ''
    weight: 1
  valid:
    path_src: data/script_conv/corpus/cyrl2mong.valid.src
    path_tgt: data/script_conv/corpus/cyrl2mong.valid.tgt
    transforms:
    - sentencepiece
    - prefix
    src_prefix: <2mn_Mong>
    tgt_prefix: ''
transforms_configs:
  sentencepiece:
    src_subword_model: data/script_conv/run/converter_char.model
    tgt_subword_model: data/script_conv/run/converter_char.model
  filtertoolong:
    src_seq_length: 128
    tgt_seq_length: 128
model:
  architecture: transformer
  hidden_size: 512
  encoder:
    layers: 6
  decoder:
    layers: 6
  heads: 8
  transformer_ff: 2048
  embeddings:
    word_vec_size: 512
    position_encoding_type: SinusoidalInterleaved
  share_embeddings: true
  share_decoder_embeddings: true
training:
  model_path: data/script_conv/run/ckpt
  batch_type: tokens
  accum_count:
  - 1
  dropout:
  - 0.1
  attention_dropout:
  - 0.1
  optim: adamw
  decay_method: noam
  label_smoothing: 0.1
  world_size: 1
  train_steps: 100000
  valid_steps: 2000
  save_checkpoint_steps: 2000
  keep_checkpoint: 5
  batch_size: 8192
  learning_rate: 2.0
  warmup_steps: 4000
  compute_dtype: bf16
  gpu_ranks:
  - 0
