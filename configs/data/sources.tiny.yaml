# Offline, fixture-backed registry used only when `--profile tiny` is
# passed to `rinchen data fetch`/`ls`. Every entry uses `kind: local`, so
# fetching this registry makes zero network requests -- this is what
# proves D1's STOP gate: "rinchen data fetch --profile tiny --all works
# offline using local:// fixtures."
sources:
  - id: opus-api-sample
    kind: local
    langs: [mn, en]
    url: "local://tests/fixtures/raw/opus_api_mn_en.json"
  # NOTE: `langs: [mn]` on warc-sample and news-html-sample below is a
  # schema/kind-dispatch test value only. The actual fixture content
  # (sample.warc.gz's 5 records, mn_news.html) is synthetic placeholder
  # English text, not real Mongolian. Do NOT use these two fixtures to
  # validate language-detection or script-detection logic -- they will
  # give a false positive/negative since the content doesn't match the
  # declared language.
  - id: warc-sample
    kind: local
    langs: [mn]
    url: "local://tests/fixtures/raw/sample.warc.gz"
  - id: news-html-sample
    kind: local
    langs: [mn]
    url: "local://tests/fixtures/raw/mn_news.html"
  - id: moses-zip-sample
    kind: local
    langs: [mn, en]
    url: "local://tests/fixtures/raw/moses_mn_en.zip"
