# Offline registry of the seven committed fixtures of the tiny pipeline (D15, spec P2 and P5),
# read by its `fetch` stage and by nothing else. Every entry is `kind: local`, so fetching it
# copies a file of the checkout and makes no network request. The digests that the files must
# have are pinned in configs/tiny/tiny.yaml (`fixtures.sha256`) and are checked before a file is
# read, so no entry here repeats one. The text is templated and generated by
# scripts/build_parallel_fixtures.py; it is not a real corpus.
sources:
  - id: tiny-eng-khk
    kind: local
    langs: [eng_Latn, khk_Cyrl]
    url: "local://tests/fixtures/parallel/eng_Latn-khk_Cyrl.tsv"
  - id: tiny-rus-khk
    kind: local
    langs: [rus_Cyrl, khk_Cyrl]
    url: "local://tests/fixtures/parallel/rus_Cyrl-khk_Cyrl.tsv"
  - id: tiny-mong
    kind: local
    langs: [mn_Mong, khk_Cyrl, eng_Latn]
    url: "local://tests/fixtures/parallel/mn_Mong.tsv"
  - id: tiny-mono-khk
    kind: local
    langs: [khk_Cyrl, eng_Latn]
    url: "local://tests/fixtures/parallel/mono_khk_Cyrl.tsv"
  - id: tiny-noise
    kind: local
    langs: [eng_Latn, khk_Cyrl, rus_Cyrl]
    url: "local://tests/fixtures/parallel/noise.tsv"
  - id: tiny-nouns
    kind: local
    langs: [khk_Cyrl, eng_Latn, rus_Cyrl]
    url: "local://tests/fixtures/parallel/nouns.tsv"
  - id: tiny-entities
    kind: local
    langs: [khk_Cyrl, eng_Latn, rus_Cyrl]
    url: "local://tests/fixtures/parallel/entities.tsv"
