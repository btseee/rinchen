name: Bug report
description: Something does not work as documented or as you expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem.

        If the problem is a security vulnerability, do not use this form. [Report it privately](https://github.com/btseee/rinchen/security/advisories/new) instead.

        Do not paste secrets. Remove tokens, passwords and personal data from any output before you post it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you ran and what you saw. Quote the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that start from a clean checkout, with the exact commands.
      placeholder: |
        1. uv sync --frozen --group dev
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run rinchen doctor`
      description: Paste the whole output. It lists the versions of the packages the project pins.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The Rinchen commit (`git rev-parse --short HEAD`), then `python --version` and `uv --version`.
      placeholder: abc1234, Python 3.14.x, uv x.y.z
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other (say which under "Anything else?")
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Logs, the command that was running, or what you already tried.
      render: text
