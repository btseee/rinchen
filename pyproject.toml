[project]
name = "rinchen"
version = "0.0.0"
description = "Open-source, Mongolian-centric machine translation trained from scratch."
requires-python = "==3.14.*"
dependencies = [
    "torch==2.14.1",
    "eole==0.6.4",
    "pyonmttok==1.38.1",
    "ctranslate2==4.8.4",
    "transformers==5.21.0",
    "tokenizers==0.23.3",
    "sentencepiece==0.2.1",
    "sacrebleu==2.6.0",
    "kiwipiepy==0.24.0",
    "fasttext-new==0.1.0",
    "fasttext-wheel==0.9.2",
    "datasketch==2.0.0",
    "datasets",
    "huggingface_hub",
    "pyarrow",
    "polars",
    "duckdb",
    "numpy",
    "pandas",
    "scipy",
    "trafilatura",
    "warcio",
    "httpx",
    "selectolax",
    "beautifulsoup4",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "typer",
    "rich",
    "structlog",
    "jinja2",
    "python-multipart",
    "prometheus-client",
    "regex",
    "PyYAML",
]

[project.scripts]
rinchen = "rinchen.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
    "pytest-xdist",
    "pytest-cov",
    "pytest-timeout",
    "pre-commit",
    "ty",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
pyonmttok = [
    { path = "vendor/wheels/pyonmttok-1.38.1-cp314-cp314-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { path = "vendor/wheels/pyonmttok-1.38.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" },
]
fasttext-wheel = { path = "vendor/wheels/fasttext_wheel-0.9.2-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rinchen"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
markers = [
    "network: tests that make real network calls",
    "subprocess: tests that spawn real subprocesses",
]

[tool.ruff.lint.per-file-ignores]
# The capitalized module name deliberately mirrors the real fasttext package's
# own `fasttext.FastText` submodule, for import compatibility (see the shim's
# docstrings and DECISIONS.md); renaming it would break that contract.
"vendor/fasttext-wheel-shim/src/fasttext/FastText.py" = ["N999"]
