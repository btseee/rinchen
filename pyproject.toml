[project]
name = "rinchen"
version = "0.0.0"
description = "Open-source, Mongolian-centric machine translation trained from scratch."
requires-python = "==3.14.*"
dependencies = [
    "torch==2.14.1",
    "eole==0.6.4",
    "ctranslate2==4.8.4",
    "transformers==5.21.0",
    "tokenizers==0.23.3",
    "sentencepiece==0.2.1",
    "sacrebleu==2.6.0",
    "kiwipiepy==0.24.0",
    "fasttext-new==0.1.0",
    "datasketch==2.0.0",
    "datasets",
    "huggingface_hub",
    "pyarrow",
    "polars",
    "duckdb",
    "numpy",
    "pandas",
    "scipy",
    "trafilatura",
    "warcio",
    "httpx",
    "selectolax",
    "beautifulsoup4",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rinchen"]
